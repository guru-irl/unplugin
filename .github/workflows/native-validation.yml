name: native validation
on:
  push:
    branches: [test/native-rule-red]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: sxzz/workflows/setup-js@main
      - run: pnpm run build
      - run: pnpm exec vitest run test/unit-tests/filter/native-rules.test.ts
